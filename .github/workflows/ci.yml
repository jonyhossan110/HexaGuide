name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install HexaGuide
        run: pip install -e .

      - name: Verify CLI entry point exists
        run: HexaGuide --version

      - name: Run full workflow smoke test
        run: HexaGuide example.com --no-save

      - name: Run single-section smoke test
        run: HexaGuide example.com --section recon --no-save

      - name: Verify report saving
        run: |
          HexaGuide testdomain.com
          python -c "import os, glob; files=glob.glob('reports/testdomain.com_*.txt'); assert files, 'Report not saved!'; print('Report OK:', files[0])"
